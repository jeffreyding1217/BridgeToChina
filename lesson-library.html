<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library — Bridge to China</title>
<style>
  :root{
    --blue:#1e4e8c; --blue-deep:#133761; --green:#1f8a5f; --green-deep:#146a48;
    --amber:#f2a73b; --ink:#132436; --ink-soft:#4a5c6b; --line:#dfe7e4; --tint:#f5faf8;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#eef3f2; color:var(--ink); }
  input, textarea{ font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }

  .topbar{
    background:var(--blue-deep); color:#fff; padding:14px 22px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:20; flex-wrap:wrap; gap:8px;
  }
  .topbar .brand{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
  .topbar .hint{ font-size:0.78rem; color:#bcd0e4; }

  .app{ display:grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 56px); }

  .sidebar{ background:#fff; border-right:1px solid var(--line); padding: 18px 10px; overflow-y:auto; }
  .lesson-btn{
    width:100%; text-align:left; background:none; border:none; padding:11px 12px; border-radius:9px;
    cursor:pointer; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; font-size:0.86rem; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:10px; margin-bottom:3px; transition: background .12s ease, color .12s ease;
  }
  .lesson-btn:hover{ background:var(--tint); color:var(--ink); }
  .lesson-btn.active{ background:var(--blue); color:#fff; }
  .lesson-btn .num{
    width:24px; height:24px; border-radius:50%; background:var(--tint); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
  }
  .lesson-btn.active .num{ background:rgba(255,255,255,0.2); color:#fff; }

  .viewer{ display:flex; flex-direction:column; align-items:center; padding: 26px 20px 40px; }
  .stage-wrap{ width:100%; max-width: 1100px; }
  .lesson-title{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:1.3rem; color:var(--blue-deep); margin: 0 0 4px; }
  .lesson-sub{ font-size:0.86rem; color:var(--ink-soft); margin-bottom:16px; }

  .stage{
    position:relative; width:100%; aspect-ratio: 16/9; background:#fff; border-radius:12px;
    overflow:hidden; box-shadow: 0 16px 40px rgba(19,36,54,0.18); border:1px solid var(--line);
  }
  .stage:fullscreen{ border-radius:0; aspect-ratio:unset; }
  .slide{ position:absolute; inset:0; padding: 4.2% 4.6%; display:flex; flex-direction:column; font-size: clamp(9px, 1.15vw, 20px); }
  .slide.dark{ background:var(--blue-deep); color:#fff; }
  .slide.tint{ background:var(--tint); }
  .slide.light{ background:#fff; }

  .eyebrow{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; font-weight:700; letter-spacing:0.12em; color:var(--green-deep); margin-bottom:0.6em; }
  .slide.dark .eyebrow{ color:#7fd9b2; }
  .slide h1{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:2.6em; line-height:1.08; margin:0 0 0.3em; color:var(--blue-deep); }
  .slide.dark h1{ color:#fff; }
  .slide .meta{ font-size:1.05em; color: var(--ink-soft); margin-bottom: 0.8em; }
  .slide.dark .meta{ color:#d7e4ee; }

  .field-row{ display:flex; gap: 2.2em; margin-top:auto; padding-top: 1em; flex-wrap:wrap; }
  .field{ flex:1; min-width: 110px; }
  .field label{ display:block; font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.68em; font-weight:700; letter-spacing:0.08em; color:#9fb3c8; margin-bottom:0.4em; }
  .field input{
    width:100%; background:transparent; border:none; border-bottom:1.5px solid #44608a; color:#fff;
    font-size:1.05em; padding:0.25em 0.1em; outline:none;
  }
  .field input::placeholder{ color:#5e7ba3; }
  .slide.light .field label, .slide.tint .field label{ color:var(--ink-soft); }
  .slide.light .field input, .slide.tint .field input{ border-bottom-color:#c7d3d0; color:var(--ink); }
  .field input:focus{ border-bottom-color:var(--amber); }

  .icon-circle{
    width: 2em; height:2em; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.95em; color:#fff; flex-shrink:0;
  }

  .focus-row{ display:flex; gap:0.9em; align-items:flex-start; padding: 0.9em 0; border-bottom:1px solid var(--line); }
  .focus-row:last-child{ border-bottom:none; }
  .focus-row b{ display:block; font-size:1.12em; margin-bottom:0.2em; }
  .focus-row p{ margin:0; color:var(--ink-soft); font-size:0.92em; line-height:1.5; }

  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 1.4em; flex:1; min-height:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:0.7em; padding: 1em 1.2em; overflow-y:auto; }
  .card.tintbg{ background:var(--tint); }
  .card h4{ margin:0 0 0.8em; font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; letter-spacing:0.1em; color:var(--green-deep); }
  .flow-item{ display:flex; gap:0.8em; margin-bottom:0.7em; }
  .flow-time{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; font-weight:700; color:var(--green-deep); width:5.4em; flex-shrink:0; white-space:nowrap; }
  .flow-item b{ display:block; font-size:0.95em; }
  .flow-item span{ color:var(--ink-soft); font-size:0.82em; }

  .line-input{
    width:100%; border:none; border-bottom:1.5px dashed #c7d3d0; background:transparent; padding:0.4em 0.1em;
    font-size:0.95em; color:var(--ink); outline:none; margin-bottom:0.9em;
  }
  .line-input:focus{ border-bottom-color:var(--blue); border-bottom-style:solid; }

  .question-row{ display:flex; align-items:center; gap:0.8em; padding:0.55em 0; }
  .question-row span{ font-size:0.98em; }
  .chk{ width:1.3em; height:1.3em; border-radius:4px; border:2px solid var(--green); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .chk.checked{ background:var(--green); }
  .chk.checked::after{ content:"✓"; color:#fff; font-size:0.85em; font-weight:700; }

  .ib-row{ display:flex; align-items:center; gap:0.8em; background:var(--tint); border-radius:0.6em; padding:0.7em 1em; margin-bottom:0.6em; }
  .ib-num{ width:1.9em; height:1.9em; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9em; flex-shrink:0; }

  .avatar-upload{
    width:5.5em; height:5.5em; border-radius:50%; background:var(--blue); display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:0.7em; font-weight:700; cursor:pointer; background-size:cover; background-position:center;
    border: 2px dashed rgba(255,255,255,0.5);
  }
  .band-pill{
    flex:1; text-align:center; border-radius:0.6em; padding: 0.9em 0.4em; font-weight:700; font-size:0.92em;
    border: 2px solid; cursor:pointer; background:#fff; color:var(--ink);
  }
  .band-pill.selected{ color:#fff; }

  .controls{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; width:100%; max-width:1100px; gap:10px; flex-wrap:wrap; }
  .nav-btn{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line); color:var(--ink);
    font-weight:600; font-size:0.9rem; padding:10px 18px; border-radius:999px; cursor:pointer; transition: all .15s ease;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .counter{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.85rem; color:var(--ink-soft); }
  .fs-btn{ background: var(--green); color:#fff; border:none; padding:10px 18px; border-radius:999px; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .fs-btn:hover{ background:var(--green-deep); }
  .clear-btn{ background:none; border:none; color:var(--ink-soft); font-size:0.78rem; text-decoration:underline; cursor:pointer; padding:4px; }

  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); display:flex; overflow-x:auto; gap:6px; padding:12px; }
    .lesson-btn{ white-space:nowrap; width:auto; margin-bottom:0; }
    .stage{ aspect-ratio: 4/5; }
    .two-col{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">BC</span> Lesson Library</div>
  <div class="hint">Fill in your name and notes right on the slide, then share this tab on your VooV call.</div>
</div>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="viewer">
    <div class="stage-wrap">
      <h2 class="lesson-title" id="lessonTitle"></h2>
      <p class="lesson-sub" id="lessonSub"></p>
      <div class="stage" id="stage"></div>
      <div class="controls">
        <button class="nav-btn" id="prevBtn">&#8592; Prev</button>
        <span class="counter" id="counter"></span>
        <button class="clear-btn" id="clearBtn">Clear my filled-in info for this lesson</button>
        <button class="fs-btn" id="fsBtn">Fullscreen for Sharing</button>
        <button class="nav-btn" id="nextBtn">Next &#8594;</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------------- Content data ---------------- */
const topics = [
{ title: "Introductions & the Verb “To Be”", level: "Beginner",
  summary: "am / is / are — introducing yourself and other people.",
  warm: ["What is your name, and how old are you?", "Where are you from?", "How are you today?", "Who is in your family?"],
  vocab: [["favorite","最喜欢的","My favorite color is blue."],["hobby","爱好","My hobby is drawing."],["city","城市","I am from a big city."],["hometown","家乡","My hometown is small and quiet."],["classmate","同学","She is my classmate."],["busy","忙的","I am busy today."],["happy","开心的","We are happy."],["family","家人","My family is big."]],
  rule: { intro: "“To be” has three forms in the present. Every English sentence needs a verb — don’t leave it out.",
    forms: [["I → am","I am a student."],["he / she / it → is","She is my teacher."],["you / we / they → are","They are friends."],["Negative: am not / isn’t / aren’t","He isn’t tall."],["Question: swap the order","Are you ready? — Yes, I am."]],
    mistakes: [["I student.","I am a student."],["She are my friend.","She is my friend."],["He no is tall.","He is not tall."],["Where you from?","Where are you from?"]],
    tip: "In speech, use short forms: I’m, she’s, they’re, isn’t, aren’t." },
  practice: [["I ___ twelve years old.","am"],["She ___ my teacher.","is"],["They ___ from China.","are"],["___ you ready?","Are"],["He ___ not at home.","is"],["We ___ good friends.","are"],["It ___ a sunny day.","is"],["Make a question: he / is / tall","Is he tall?"]],
  speak: { scenario: "Meeting a new friend", setup: "The teacher is a new classmate. The student introduces themself and finds out about the new classmate.", phrases: ["Nice to meet you.","I’m from ___.","Where are you from?","How old are you?","What is your hobby?","My favorite ___ is ___."], prompts: ["Introduce yourself in 4 sentences.","Ask the teacher 4 questions.","Introduce one family member: “My mother is… She is…”"] },
  game: { name: "Who Am I?", how: ["The teacher secretly thinks of a famous person, character or animal.","The student asks yes/no questions with “to be”.","The student has 10 questions to guess. Then switch roles."], prompts: ["Is it an animal?","Is she a singer?","Is he tall?","Are they from China?","Is it big?","Is he alive?"] },
  homework: "Write 5 sentences about yourself and your family using am / is / are." },

{ title: "Present Simple: Daily Routines", level: "Beginner-High",
  summary: "Habits and facts. do / does questions and negatives.",
  warm: ["What time do you wake up?", "What do you usually eat for breakfast?", "How do you get to school or work?", "What do you do on weekends?"],
  vocab: [["wake up","起床","I wake up at 7:00."],["usually","通常","I usually walk to school."],["always","总是","She always drinks tea."],["sometimes","有时","We sometimes eat out."],["never","从不","He never eats breakfast."],["breakfast","早餐","I have eggs for breakfast."],["homework","作业","I do my homework after dinner."],["weekend","周末","On the weekend I play football."]],
  rule: { intro: "Use the present simple for habits, routines and facts.",
    forms: [["I / you / we / they + verb","I play football."],["he / she / it + verb + s / es","She plays. He watches TV. It studies → studies"],["Negative: don’t / doesn’t + base verb","He doesn’t like fish."],["Question: Do / Does + subject + base verb","Does she play tennis?"],["Frequency word goes before the verb","I always eat breakfast."]],
    mistakes: [["She play tennis.","She plays tennis."],["He doesn’t likes fish.","He doesn’t like fish."],["Does she goes to school?","Does she go to school?"],["I am go to school by bus.","I go to school by bus."]],
    tip: "After does / doesn’t the verb goes back to the base form — the -s moves to “does”." },
  practice: [["She ___ (play) the piano every day.","plays"],["We ___ (not / eat) meat.","don’t eat"],["He ___ (watch) TV at night.","watches"],["___ you ___ (like) music?","Do … like"],["My brother ___ (study) English on Monday.","studies"],["She ___ (not / live) here.","doesn’t live"],["___ he ___ (have) a pet?","Does … have"],["Put in order: always / I / breakfast / eat","I always eat breakfast."]],
  speak: { scenario: "A day in my life", setup: "The student interviews the teacher about a normal day. Then switch.", phrases: ["What time do you ___?","First, I ___.","Then I ___.","After that, I ___.","Finally, I ___.","I usually / sometimes / never ___."], prompts: ["Tell me about your morning, step by step.","Ask the teacher 5 questions about their day.","What is different on weekends?"] },
  game: { name: "Truth or Lie: Routines", how: ["Each player says 3 sentences about their routine. One is a lie.","The other player asks “Do you…?” questions to find the lie.","One point for each lie found. Play 3 rounds."], prompts: ["Do you wake up at 5 a.m.?","Does your family eat dinner together?","Do you play sports every day?","Does your school start at 8?"] },
  homework: "Write 6 sentences about your normal day. Use two frequency words (always, usually, sometimes, never)." },

{ title: "Present Continuous: Right Now", level: "Beginner-High",
  summary: "am / is / are + -ing. Now vs. every day.",
  warm: ["What are you doing right now?", "What is the weather like where you are?", "Who is in your home with you at the moment?", "What are you wearing today?"],
  vocab: [["cook","做饭","My mother is cooking dinner."],["wear","穿","He is wearing a red jacket."],["wait","等","We are waiting for the bus."],["listen","听","I am listening to music."],["draw","画","She is drawing a cat."],["run","跑","They are running in the park."],["carry","拿；搬","He is carrying a heavy bag."],["laugh","笑","The children are laughing."]],
  rule: { intro: "Use am / is / are + verb-ing for actions happening now or around now.",
    forms: [["Form: am / is / are + verb-ing","I am reading. She is cooking."],["Spelling: play → playing, make → making (drop e), run → running (double)",""],["Negative: am not / isn’t / aren’t + -ing","They aren’t watching TV."],["Question: Am / Is / Are + subject + -ing","Are you listening?"],["Habit vs. now","I drink tea every day. / I am drinking tea now."]],
    mistakes: [["I am play games now.","I am playing games now."],["She is run.","She is running."],["I am wanting a drink.","I want a drink."],["He studying now.","He is studying now."]],
    tip: "Verbs like want, like, know, love are not normally used with -ing." },
  practice: [["I ___ (read) a book now.","am reading"],["She ___ (cook) dinner.","is cooking"],["They ___ (not / watch) TV.","aren’t watching"],["___ you ___ (listen)?","Are … listening"],["He ___ (run) in the park.","is running"],["We ___ (make) a cake.","are making"],["Choose: “I (go / am going) to school every day.”","go"],["Choose: “Look! It (rains / is raining).”","is raining"]],
  speak: { scenario: "Describe the scene", setup: "The teacher describes a busy place (a market, a park, a classroom) or shows a photo on screen. The student says what each person is doing.", phrases: ["In the picture, I can see ___.","A man is ___-ing.","The children are ___-ing.","Maybe she is ___-ing.","What is he doing?"], prompts: ["Describe 5 different people or things.","Phone call: “Hi! What are you doing?” — act it out.","Describe what is happening outside your window."] },
  game: { name: "Charades", how: ["One player acts out an action on camera without talking.","The other guesses: “You are ___-ing!”","Take turns. First to 5 correct guesses wins."], prompts: ["swimming","brushing teeth","riding a bike","cooking noodles","sleeping","playing the guitar","taking a photo","washing a car"] },
  homework: "Look around you. Write 5 sentences about what people or things are doing right now." },

{ title: "Past Simple: Yesterday & Last Week", level: "Beginner-High",
  summary: "Regular and irregular verbs. did / didn’t.",
  warm: ["What did you do yesterday?", "What did you eat for dinner last night?", "Where did you go last weekend?", "Who did you talk to today?"],
  vocab: [["go → went","去","I went to the park."],["eat → ate","吃","She ate noodles."],["see → saw","看见","We saw a movie."],["buy → bought","买","He bought a new phone."],["have → had","有；吃","They had a party."],["take → took","拿；乘","I took a photo."],["meet → met","遇见","I met my friend."],["write → wrote","写","She wrote a letter."]],
  rule: { intro: "Use the past simple for finished actions at a time in the past.",
    forms: [["Regular: verb + ed","walk → walked, live → lived, study → studied, stop → stopped"],["Irregular: learn them!","go → went, eat → ate, see → saw"],["Negative: didn’t + base verb","I didn’t go."],["Question: Did + subject + base verb","Did you see him?"],["Time words","yesterday, last week, two days ago, in 2020"],["To be: was / were","I was tired. They were late."]],
    mistakes: [["I go to the park yesterday.","I went to the park yesterday."],["She didn’t went.","She didn’t go."],["Did you saw it?","Did you see it?"],["I eated rice.","I ate rice."]],
    tip: "After did / didn’t the verb is in the base form. Only one word shows the past!" },
  practice: [["Yesterday I ___ (go) to the market.","went"],["She ___ (watch) a movie last night.","watched"],["We ___ (not / eat) lunch.","didn’t eat"],["___ you ___ (see) him?","Did … see"],["He ___ (buy) a new phone.","bought"],["They ___ (study) for the test.","studied"],["I ___ (be) tired yesterday.","was"],["Where ___ you ___ (go) last weekend?","did … go"]],
  speak: { scenario: "Tell me about your weekend", setup: "The student tells a story about last weekend or a holiday. The teacher asks follow-up questions.", phrases: ["First, I ___.","Then we ___.","After that, ___.","Finally, ___.","It was ___.","Did you enjoy it? / Who did you go with?"], prompts: ["Tell the story in at least 6 sentences.","Teacher asks: What did you do next? How did you feel?","Switch: the teacher tells, the student asks."] },
  game: { name: "Chain Story", how: ["The teacher starts: “Yesterday, I woke up and…”","The student adds one sentence in the past simple, then the teacher, and so on.","Keep going for 8 sentences. Use “and then”, “suddenly”, “after that”."], prompts: ["Yesterday, I woke up and…","Suddenly, I saw…","Then I decided to…","In the end, we…"] },
  homework: "Write a paragraph (5–6 sentences) about your last holiday or weekend using the past simple." },

{ title: "Talking About the Future: will & going to", level: "Intermediate-Low",
  summary: "Plans, decisions, promises and predictions.",
  warm: ["What are you going to do this weekend?", "What do you want to be in the future?", "What do you think the weather will be like tomorrow?", "Where do you want to travel one day?"],
  vocab: [["plan","计划","I have a plan for Sunday."],["soon","很快","The class will start soon."],["probably","大概","It will probably rain."],["trip","旅行","We are going on a trip."],["future","未来","In the future I want to be a doctor."],["promise","承诺","I promise I will call you."],["maybe","也许","Maybe we will go to the beach."],["next week","下周","I am busy next week."]],
  rule: { intro: "English has two common ways to talk about the future.",
    forms: [["going to = plans and things you can see coming","I’m going to visit my grandma on Sunday. Look at those clouds — it’s going to rain."],["will = quick decisions, promises, offers, opinions","I’ll help you. I think it will be sunny."],["Form: am/is/are going to + base verb","She is going to study tonight."],["Form: will + base verb (won’t = will not)","He won’t come. I’ll call you."],["Questions","Will you help me? Are you going to study?"]],
    mistakes: [["I will to go.","I will go."],["She will goes.","She will go."],["I going to study tomorrow.","I am going to study tomorrow."],["He will not to come.","He won’t come."]],
    tip: "After will and to-go the verb is always the base form — no -s, no -ing." },
  practice: [["I ___ (visit) my grandparents next week. (plan)","am going to visit"],["“It’s cold.” “I ___ (close) the window.” (decision)","will close / ’ll close"],["Look at the sky! It ___ (rain).","is going to rain"],["I think he ___ (win).","will win"],["She ___ (not / come) tomorrow.","won’t come"],["___ you ___ (study) tonight? (plan)","Are … going to study"],["I promise I ___ (call) you.","will call"],["Make a question: will / you / help / me","Will you help me?"]],
  speak: { scenario: "Plan a dream trip", setup: "The student plans a dream trip with the teacher: where, when, with whom, what they are going to do.", phrases: ["I’m going to ___.","We’ll probably ___.","I think it will be ___.","Maybe we’ll ___.","What are you going to do there?"], prompts: ["Explain your trip in 6 sentences.","The teacher asks 3 questions about the plan.","Make 2 predictions about the trip with “I think … will …”."] },
  game: { name: "Fortune Teller", how: ["The student is a fortune teller and predicts the teacher’s future: “You will…”","Each player makes 5 predictions. They can be funny!","Then talk about real plans: “I’m going to…”."], prompts: ["You will be famous.","You will travel to ___.","You will meet ___.","You will learn ___.","You won’t ___."] },
  homework: "Write 5 sentences about your plans for next month (going to) and 3 predictions (will)." },

{ title: "Nouns & Articles: a / an / the", level: "Intermediate-Low",
  summary: "Plurals, countable / uncountable nouns, some / any.",
  warm: ["What do you have in your bag?", "What is in your refrigerator?", "What animals do you like?", "What is your favorite place in your city?"],
  vocab: [["egg","鸡蛋","I eat an egg for breakfast."],["sandwich","三明治","She ate two sandwiches."],["vegetable","蔬菜","Eat more vegetables."],["rice","米饭","We eat rice every day."],["bread","面包","I bought some bread."],["water","水","Do you want some water?"],["information","信息","I need some information."],["homework","作业","I have a lot of homework."]],
  rule: { intro: "Articles are small words that don’t exist in Chinese — and they matter a lot in English.",

/* ---------------- Build lesson/slide model ---------------- */
function introSlides(){
  return [
    { type: "title", badge: "Lesson 0 · First Session", title: "Welcome & Level Check", level: "All Levels", note: "This is the student's first session — use it to welcome them and find their level." },
    { type: "teacher" },
    { type: "icebreaker" },
    { type: "levelcheck", data: levelBands[0] },
    { type: "levelcheck", data: levelBands[1] },
    { type: "levelcheck", data: levelBands[2] },
    { type: "introwrap" },
  ];
}
function topicSlides(topic){
  return [
    { type: "title", badge: "Grammar Lesson", title: topic.title, level: topic.level, note: topic.summary },
    { type: "plan", topic },
    { type: "warm", topic },
    { type: "vocab", topic },
    { type: "rule", topic },
    { type: "drill", topic },
    { type: "speak", topic },
    { type: "game", topic },
    { type: "wrap", topic },
  ];
}

const lessons = [
  { id: 0, label: "Lesson 0", title: "Welcome & Level Check", slides: introSlides(),
    sub: "First-session welcome, teacher introduction, and level check." },
  ...topics.map((t, i) => ({
    id: i + 1, label: `Lesson ${i+1}`, title: t.title, slides: topicSlides(t),
    sub: "30-minute lesson: warm-up, vocabulary, grammar, practice, speaking, game, wrap-up.",
  })),
];

/* ---------------- State + storage ---------------- */
let currentLesson = 0;
let currentSlide = 0;

function storeKey(field){ return `vwt-slide:${currentLesson}:${currentSlide}:${field}`; }
function save(field, value){ try{ localStorage.setItem(storeKey(field), value); }catch(e){} }
function load(field, fallback=""){ try{ const v = localStorage.getItem(storeKey(field)); return v===null?fallback:v; }catch(e){ return fallback; } }

/* ---------------- Rendering ---------------- */
const sidebar = document.getElementById('sidebar');
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const lessonTitle = document.getElementById('lessonTitle');
const lessonSub = document.getElementById('lessonSub');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderSidebar(){
  sidebar.innerHTML = '';
  lessons.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lesson-btn' + (l.id === currentLesson ? ' active' : '');
    btn.innerHTML = `<span class="num">${l.id}</span> ${l.title}`;
    btn.onclick = () => { currentLesson = l.id; currentSlide = 0; render(); };
    sidebar.appendChild(btn);
  });
}

}

  return `<div class="eyebrow" style="color:${SEG[key][1]}">${SEG[key][0]}</div><h1 style="font-size:1.7em;margin-bottom:0.45em;">${E(title)}</h1>`;
}

      <div class="two-col" style="grid-template-columns: 1fr 1.6fr;">

function icebreakerSlideHTML(){

function introWrapSlideHTML(){
  const bands = [["Beginner","#1f8a5f"],["Beginner-High","#3e8f6b"],["Intermediate","#1e4e8c"],["Intermediate-High","#f2a73b"]];
  return `
    <div class="slide tint">
      <div class="eyebrow">WRAP-UP</div>
      <h1 style="font-size:1.6em;">Set the Starting Level</h1>
      <div style="display:flex; gap:0.7em; margin-bottom:0.8em;">
        ${bands.map(([label,color]) => `<div class="band-pill" style="border-color:${color};" data-band="${label}" data-color="${color}">${label}</div>`).join('')}
      </div>
      <div class="card" style="flex:1;">

function slideHTML(s){
  switch(s.type){
    case 'title': return titleSlideHTML(s);
    case 'plan': return planSlideHTML(s);
    case 'warm': return warmSlideHTML(s);
    case 'vocab': return vocabSlideHTML(s);
    case 'rule': return ruleSlideHTML(s);
    case 'drill': return drillSlideHTML(s);
    case 'speak': return speakSlideHTML(s);
    case 'game': return gameSlideHTML(s);
    case 'wrap': return wrapSlideHTML(s);
    case 'teacher': return teacherSlideHTML();
    case 'icebreaker': return icebreakerSlideHTML();
    case 'levelcheck': return levelCheckSlideHTML(s);
    case 'introwrap': return introWrapSlideHTML();
    default: return '';
  }
}

function wireInputs(){
  stage.querySelectorAll('input[data-field]').forEach(inp => {
    inp.value = load(inp.dataset.field, '');
    inp.addEventListener('input', () => save(inp.dataset.field, inp.value));
  });
  stage.querySelectorAll('.chk').forEach(chk => {
    const key = 'chk_' + chk.dataset.chk;
    if(load(key) === '1') chk.classList.add('checked');
    chk.addEventListener('click', () => {
      chk.classList.toggle('checked');
      save(key, chk.classList.contains('checked') ? '1' : '0');
    });
  });
  stage.querySelectorAll('.band-pill').forEach(pill => {
    const key = 'band_selected';
    if(load(key) === pill.dataset.band){
      pill.classList.add('selected');
      pill.style.background = pill.dataset.color;
    }
    pill.addEventListener('click', () => {
      stage.querySelectorAll('.band-pill').forEach(p => { p.classList.remove('selected'); p.style.background = '#fff'; p.style.color = 'var(--ink)'; });
      pill.classList.add('selected');
      pill.style.background = pill.dataset.color;
      pill.style.color = '#fff';
      save(key, pill.dataset.band);
    });
  });
  const ansBtn = stage.querySelector('#ansBtn');
  if(ansBtn){
    ansBtn.addEventListener('click', () => {
      const show = ansBtn.dataset.on !== '1';
      ansBtn.dataset.on = show ? '1' : '0';
      stage.querySelectorAll('.ans').forEach(a => a.style.visibility = show ? 'visible' : 'hidden');
      ansBtn.textContent = show ? 'Hide answers' : 'Show answers (teacher)';
    });
  }
  const avatarCircle = stage.querySelector('#avatarCircle');
  const avatarFile = stage.querySelector('#avatarFile');
  if(avatarCircle && avatarFile){
    const saved = load('t_photo', '');
    if(saved){ avatarCircle.style.backgroundImage = `url(${saved})`; avatarCircle.textContent = ''; }
    avatarCircle.addEventListener('click', () => avatarFile.click());
    avatarFile.addEventListener('change', () => {
      const file = avatarFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        avatarCircle.style.backgroundImage = `url(${reader.result})`;
        avatarCircle.textContent = '';
        save('t_photo', reader.result);
      };
      reader.readAsDataURL(file);
    });
  }
}

function render(){
  const l = lessons.find(x => x.id === currentLesson);
  const s = l.slides[currentSlide];
  stage.innerHTML = slideHTML(s);
  wireInputs();
  counter.textContent = `Slide ${currentSlide + 1} of ${l.slides.length}`;
  lessonTitle.textContent = `${l.label}: ${l.title}`;
  lessonSub.textContent = l.sub;
  prevBtn.disabled = currentSlide === 0;
  nextBtn.disabled = currentSlide === l.slides.length - 1;
  renderSidebar();
}

prevBtn.onclick = () => { if(currentSlide > 0){ currentSlide--; render(); } };
nextBtn.onclick = () => {
  const l = lessons.find(x => x.id === currentLesson);
  if(currentSlide < l.slides.length - 1){ currentSlide++; render(); }
};
document.addEventListener('keydown', (e) => {
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
});
document.getElementById('fsBtn').onclick = () => { if(stage.requestFullscreen) stage.requestFullscreen(); };
document.getElementById('clearBtn').onclick = () => {
  if(!confirm('Clear everything typed in for this lesson? This cannot be undone.')) return;
  const prefix = `vwt-slide:${currentLesson}:`;
  Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k => localStorage.removeItem(k));
  render();
};

render();
</script>
