<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Library — Bridge to China</title>
<style>
  :root{
    --blue:#1e4e8c; --blue-deep:#133761; --green:#1f8a5f; --green-deep:#146a48;
    --amber:#f2a73b; --ink:#132436; --ink-soft:#4a5c6b; --line:#dfe7e4; --tint:#f5faf8;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#eef3f2; color:var(--ink); }
  input, textarea{ font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }

  .topbar{
    background:var(--blue-deep); color:#fff; padding:14px 22px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:20; flex-wrap:wrap; gap:8px;
  }
  .topbar .brand{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
  .topbar .hint{ font-size:0.78rem; color:#bcd0e4; }

  .app{ display:grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 56px); }

  .sidebar{ background:#fff; border-right:1px solid var(--line); padding: 14px 10px; overflow-y:auto; position:sticky; top:56px; align-self:start; max-height:calc(100vh - 56px); }
  .side-head{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.7rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--green-deep); padding:14px 12px 6px; }
  .lesson-btn{
    width:100%; text-align:left; background:none; border:none; padding:11px 12px; border-radius:9px;
    cursor:pointer; font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; font-size:0.86rem; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:10px; margin-bottom:3px; transition: background .12s ease, color .12s ease;
  }
  .lesson-btn:hover{ background:var(--tint); color:var(--ink); }
  .lesson-btn.active{ background:var(--blue); color:#fff; }
  .lesson-btn .num{
    width:24px; height:24px; border-radius:50%; background:var(--tint); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; flex-shrink:0;
    font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
  }
  .lesson-btn.active .num{ background:rgba(255,255,255,0.2); color:#fff; }

  .viewer{ display:flex; flex-direction:column; align-items:center; padding: 26px 20px 40px; }
  .stage-wrap{ width:100%; max-width: 1100px; }
  .lesson-title{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:1.3rem; color:var(--blue-deep); margin: 0 0 4px; }
  .lesson-sub{ font-size:0.86rem; color:var(--ink-soft); margin-bottom:16px; }

  .stage{
    position:relative; width:100%; aspect-ratio: 16/9; background:#fff; border-radius:12px;
    overflow:hidden; box-shadow: 0 16px 40px rgba(19,36,54,0.18); border:1px solid var(--line);
  }
  .stage:fullscreen{ border-radius:0; aspect-ratio:unset; }
  .slide{ position:absolute; inset:0; padding: 4.2% 4.6%; display:flex; flex-direction:column; font-size: clamp(9px, 1.15vw, 20px); }
  .slide.dark{ background:var(--blue-deep); color:#fff; }
  .slide.tint{ background:var(--tint); }
  .slide.light{ background:#fff; }

  .eyebrow{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; font-weight:700; letter-spacing:0.12em; color:var(--green-deep); margin-bottom:0.6em; }
  .slide.dark .eyebrow{ color:#7fd9b2; }
  .slide h1{ font-family:Georgia,'Songti SC','Noto Serif SC',serif; font-weight:700; font-size:2.6em; line-height:1.08; margin:0 0 0.3em; color:var(--blue-deep); }
  .slide.dark h1{ color:#fff; }
  .slide .meta{ font-size:1.05em; color: var(--ink-soft); margin-bottom: 0.8em; }
  .slide.dark .meta{ color:#d7e4ee; }

  .field-row{ display:flex; gap: 2.2em; margin-top:auto; padding-top: 1em; flex-wrap:wrap; }
  .field{ flex:1; min-width: 110px; }
  .field label{ display:block; font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.68em; font-weight:700; letter-spacing:0.08em; color:#9fb3c8; margin-bottom:0.4em; }
  .field input{
    width:100%; background:transparent; border:none; border-bottom:1.5px solid #44608a; color:#fff;
    font-size:1.05em; padding:0.25em 0.1em; outline:none;
  }
  .field input::placeholder{ color:#5e7ba3; }
  .slide.light .field label, .slide.tint .field label{ color:var(--ink-soft); }
  .slide.light .field input, .slide.tint .field input{ border-bottom-color:#c7d3d0; color:var(--ink); }
  .field input:focus{ border-bottom-color:var(--amber); }

  .icon-circle{
    width: 2em; height:2em; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.95em; color:#fff; flex-shrink:0;
  }

  .focus-row{ display:flex; gap:0.9em; align-items:flex-start; padding: 0.9em 0; border-bottom:1px solid var(--line); }
  .focus-row:last-child{ border-bottom:none; }
  .focus-row b{ display:block; font-size:1.12em; margin-bottom:0.2em; }
  .focus-row p{ margin:0; color:var(--ink-soft); font-size:0.92em; line-height:1.5; }

  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 1.4em; flex:1; min-height:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:0.7em; padding: 1em 1.2em; overflow-y:auto; }
  .card.tintbg{ background:var(--tint); }
  .card h4{ margin:0 0 0.8em; font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; letter-spacing:0.1em; color:var(--green-deep); }
  .flow-item{ display:flex; gap:0.8em; margin-bottom:0.7em; }
  .flow-time{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.78em; font-weight:700; color:var(--green-deep); width:5.4em; flex-shrink:0; white-space:nowrap; }
  .flow-item b{ display:block; font-size:0.95em; }
  .flow-item span{ color:var(--ink-soft); font-size:0.82em; }

  .line-input{
    width:100%; border:none; border-bottom:1.5px dashed #c7d3d0; background:transparent; padding:0.4em 0.1em;
    font-size:0.95em; color:var(--ink); outline:none; margin-bottom:0.9em;
  }
  .line-input:focus{ border-bottom-color:var(--blue); border-bottom-style:solid; }

  .question-row{ display:flex; align-items:center; gap:0.8em; padding:0.55em 0; }
  .question-row span{ font-size:0.98em; }
  .chk{ width:1.3em; height:1.3em; border-radius:4px; border:2px solid var(--green); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .chk.checked{ background:var(--green); }
  .chk.checked::after{ content:"✓"; color:#fff; font-size:0.85em; font-weight:700; }

  .ib-row{ display:flex; align-items:center; gap:0.8em; background:var(--tint); border-radius:0.6em; padding:0.7em 1em; margin-bottom:0.6em; }
  .ib-num{ width:1.9em; height:1.9em; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9em; flex-shrink:0; }

  .avatar-upload{
    width:5.5em; height:5.5em; border-radius:50%; background:var(--blue); display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:0.7em; font-weight:700; cursor:pointer; background-size:cover; background-position:center;
    border: 2px dashed rgba(255,255,255,0.5);
  }
  .band-pill{
    flex:1; text-align:center; border-radius:0.6em; padding: 0.9em 0.4em; font-weight:700; font-size:0.92em;
    border: 2px solid; cursor:pointer; background:#fff; color:var(--ink);
  }
  .band-pill.selected{ color:#fff; }

  .controls{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; width:100%; max-width:1100px; gap:10px; flex-wrap:wrap; }
  .nav-btn{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line); color:var(--ink);
    font-weight:600; font-size:0.9rem; padding:10px 18px; border-radius:999px; cursor:pointer; transition: all .15s ease;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .counter{ font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace; font-size:0.85rem; color:var(--ink-soft); }
  .fs-btn{ background: var(--green); color:#fff; border:none; padding:10px 18px; border-radius:999px; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .fs-btn:hover{ background:var(--green-deep); }
  .clear-btn{ background:none; border:none; color:var(--ink-soft); font-size:0.78rem; text-decoration:underline; cursor:pointer; padding:4px; }

  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); display:flex; overflow-x:auto; gap:6px; padding:12px; }
    .lesson-btn{ white-space:nowrap; width:auto; margin-bottom:0; }
    .side-head{ white-space:nowrap; align-self:center; padding:0 6px; }
    .sidebar{ position:static; max-height:none; }
    .stage{ aspect-ratio: 4/5; }
    .two-col{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">BC</span> Lesson Library</div>
  <div class="hint">Fill in your name and notes right on the slide, then share this tab on your VooV call.</div>
</div>

<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="viewer">
    <div class="stage-wrap">
      <h2 class="lesson-title" id="lessonTitle"></h2>
      <p class="lesson-sub" id="lessonSub"></p>
      <div class="stage" id="stage"></div>
      <div class="controls">
        <button class="nav-btn" id="prevBtn">&#8592; Prev</button>
        <span class="counter" id="counter"></span>
        <button class="clear-btn" id="clearBtn">Clear my filled-in info for this lesson</button>
        <button class="fs-btn" id="fsBtn">Fullscreen for Sharing</button>
        <button class="nav-btn" id="nextBtn">Next &#8594;</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------------- Content data ---------------- */
/* helper: T(title, summary, warm[4], vocab["word|中文|example"x8], [intro, forms["a|b"], mistakes["wrong|right"], tip], practice["q|a"x8], [scenario, setup, phrases[], prompts[]], [gameName, how[], gamePrompts[]], homework) */
const sp = a => a.map(x => x.split('|'));
function T(title, summary, warm, vocab, rule, practice, speak, game, homework){
  return { title, summary, warm, vocab: sp(vocab),
    rule: { intro: rule[0], forms: sp(rule[1]), mistakes: sp(rule[2]), tip: rule[3] },
    practice: sp(practice),
    speak: { scenario: speak[0], setup: speak[1], phrases: speak[2], prompts: speak[3] },
    game: { name: game[0], how: game[1], prompts: game[2] }, homework };
}
const BEG = [
T("Introducing Yourself and Making Friends","Say who you are, where you are from and what you like.",
 ["What is your name?","How old are you?","Where are you from?","What do you like to do?"],
 ["name|名字|My name is Mei.","age|年龄|My age is twelve.","friend|朋友|He is my friend.","hometown|家乡|My hometown is small.","student|学生|I am a student.","favorite|最喜欢的|My favorite color is blue.","hobby|爱好|My hobby is music.","nice|友好的；好的|You are very nice."],
 ["Use short, clear sentences to introduce yourself. Start with “I am” or “My name is”.",
  ["My name is ___. / I’m ___.|My name is Li Wei. I’m Li Wei.","I’m from ___. I live in ___.|I’m from China. I live in Chengdu.","I’m ___ years old.|I’m thirteen years old.","I like ___. / I don’t like ___.|I like music. I don’t like spiders.","Nice to meet you! Can we be friends?|Nice to meet you, too!"],
  ["I am 13 years.|I am 13 years old.","I come from in China.|I am from China.","My name call Li.|My name is Li. / I am called Li.","I like play football.|I like playing football."],
  "Always say your name, then one fact, then ask a question back: “What about you?”"],
 ["My name ___ Anna. (is / am)|is","I ___ from Japan. (is / am)|am","I’m ten ___ old. (year / years)|years","Make a sentence: like / I / music|I like music.","How old ___ you? (is / are)|are","Answer: “Where are you from?”|I’m from ___.","___ to meet you! (Nice / Good)|Nice","Ask back: “I like soccer. ___ you?”|What about / And"],
 ["Meet a new friend","The teacher is a new classmate. The student introduces themself and learns about the classmate.",["Hi, I’m ___.","Nice to meet you.","Where are you from?","What do you like to do?","Me too! / Really?"],["Introduce yourself in 4 sentences.","Ask the teacher 4 questions.","Say one thing you and the teacher both like."]],
 ["Two Truths and a Lie",["Say 3 sentences about yourself. One is a lie.","The other person guesses the lie.","Swap and play 3 rounds."],["I have two brothers.","I like spicy food.","I live near a river.","I can play the piano."]],
 "Write 5 sentences to introduce yourself to a new pen friend."),

T("Greetings and Common Expressions","Hello, goodbye, thanks, sorry, please.",
 ["How are you today?","What do you say when you meet your teacher in the morning?","What do you say when you want help?","What do you say when you leave?"],
 ["hello|你好|Hello, Mr. Chen!","goodbye|再见|Goodbye! See you tomorrow.","please|请|Please sit down.","thank you|谢谢|Thank you for your help.","sorry|对不起|Sorry, I’m late.","excuse me|打扰一下|Excuse me, where is the library?","you’re welcome|不客气|“Thanks!” “You’re welcome.”","see you later|回头见|See you later, Tom!"],
 ["Use the right greeting for the time of day and the right polite word for the situation.",
  ["Good morning / afternoon / evening|Good morning, Ms. Lee.","Good night = when you leave or go to bed|Good night, Mom!","How are you? — I’m fine, thanks. And you?|I’m great, thank you.","Thank you (for ___). — You’re welcome.|Thank you for your help.","Sorry / Excuse me / Pardon?|Excuse me, can you help me?"],
  ["Thank you your help.|Thank you for your help.","You welcome.|You’re welcome.","Sorry for I am late.|Sorry I’m late.","Good night! (meeting at 8 p.m.)|Good evening!"],
  "“Excuse me” gets attention. “Sorry” says you made a mistake. “Pardon?” asks someone to repeat."],
 ["At 8 a.m. you say Good ___.|morning","At 3 p.m. you say Good ___.|afternoon","“Thank you!” — “You’re ___.”|welcome","You are late. You say “___.”|Sorry","You want to ask a stranger. “___ me, …”|Excuse","“How are you?” — “I’m ___, thanks.”|fine","You didn’t hear. You say “___?”|Pardon / Sorry","Fix: “Thank you your help.”|Thank you for your help."],
 ["Polite day","The student walks through a day (morning, class, shop, evening) and uses the right expression each time.",["Good morning!","How are you?","Excuse me, …","Thank you so much.","See you later!"],["Greet the teacher 3 different ways.","Ask for help politely.","Say goodbye in 3 ways."]],
 ["Say It Right",["The teacher describes a situation.","The student says the best expression.","Swap roles and make 5 situations each."],["You step on someone’s foot.","Someone gives you a gift.","It’s 9 p.m. and you go home.","You can’t hear the teacher.","You meet a friend at noon."]],
 "Write 6 short dialogues (2 lines each) using hello, please, thank you, sorry, excuse me and goodbye."),

T("Numbers, Dates, and Time","Count, say dates and tell the time.",
 ["What is your phone number? (Say the digits.)","When is your birthday?","What time do you get up?","What is today’s date?"],
 ["thirteen|十三|I am thirteen.","thirty|三十|He is thirty.","first|第一|January is the first month.","second|第二|My birthday is on the second.","o’clock|…点钟|It’s five o’clock.","half past|…点半|It’s half past three.","quarter|一刻钟|It’s a quarter to six.","date|日期|What’s the date today?"],
 ["Numbers, dates and times each have their own pattern.",
  ["Numbers: 13–19 end in -teen, 20–90 end in -ty|thirteen / thirty, fourteen / forty","Ordinals: first, second, third, fourth … twentieth|May 1st = May first","Dates: month + ordinal; use “on”|My birthday is on May 5th.","Time: It’s + hour / half past / quarter past or to|It’s 3:30 = half past three.","Years: split in two|1998 = nineteen ninety-eight"],
  ["It is three half.|It’s half past three.","March five.|March fifth.","I get up on 7.|I get up at 7.","Fifteen and fifty sound the same.|Say them clearly: fif-TEEN / FIF-ty."],
  "Teen = stress at the end (thir-TEEN). Ty = stress at the start (THIR-ty)."],
 ["Say the number: 14|fourteen","Say the number: 40|forty","Say the ordinal: 3rd|third","It’s 7:30. Say it.|It’s half past seven.","It’s 6:15. Say it.|It’s a quarter past six.","Say the date: 12/10 (month/day)|December tenth","I get up ___ 6:30. (at / on)|at","My birthday is ___ June 3rd. (in / on)|on"],
 ["What time is it?","The student asks the teacher for times, dates and phone numbers. Then swap.",["What time is it?","It’s ___.","What’s the date today?","When is your birthday?","My number is ___."],["Say 5 times from the clock.","Say 3 important dates in your year.","Give your phone number slowly."]],
 ["Bingo or Number Dictation",["The teacher says numbers; the student writes them.","Then the student says numbers for the teacher.","Mix teens and tens (13 / 30) to listen carefully."],["13 / 30","15 / 50","March 3rd","6:45","August 22nd","1,000"]],
 "Write the dates of 5 events in your life (birthday, family birthdays, a holiday). Write the full sentence each time."),

T("Family Members and Relationships","Talk about your family and who is who.",
 ["How many people are in your family?","Do you have brothers or sisters?","Who do you live with?","Who is your favorite person in your family?"],
 ["parents|父母|My parents are teachers.","grandmother|奶奶；外婆|My grandmother lives in Wuhan.","grandfather|爷爷；外公|My grandfather is 70.","uncle|叔叔；舅舅|He is my uncle.","aunt|阿姨；姑姑|She is my aunt.","cousin|堂（表）兄弟姐妹|My cousin is my age.","husband / wife|丈夫 / 妻子|Her husband is a doctor.","relative|亲戚|We visit relatives at New Year."],
 ["Use have / has for family, and ’s to show who belongs to whom.",
  ["I have + number + family|I have two brothers and one sister.","He / She has|She has a younger brother.","There are ___ people in my family.|There are four people in my family.","’s = belongs to|my mother’s sister = my aunt","He / She is my ___.|He is my uncle."],
  ["He have two sisters.|He has two sisters.","My family have four people.|There are four people in my family.","She is my mother sister.|She is my mother’s sister.","I have a elder brother.|I have an older brother."],
  "older / younger = comparing ages. Say “my older brother”, not “my elder brother”, in everyday talk."],
 ["My father’s brother is my ___.|uncle","He ___ two sisters. (have / has)|has","There ___ five people in my family. (is / are)|are","This is my mother’s mother. She is my ___.|grandmother","Make it possessive: the brother of Tom|Tom’s brother","I ___ a younger sister. (have / has)|have","Her ___ is my uncle’s child. (cousin / aunt)|cousin","Fix: “My family have three people.”|There are three people in my family."],
 ["My family tree","The student draws a simple family tree (on paper or screen) and explains each person to the teacher.",["This is my ___.","He / She is ___ years old.","He / She works as ___.","I live with ___.","We often ___ together."],["Describe 5 family members.","Teacher asks 3 questions about them.","Tell one thing you do with your family."]],
 ["Guess Who",["Describe a family member without saying their name: “She is my mother’s sister.”","The other guesses: “Is she your aunt?”","Play 5 rounds each."],["my father’s father","my mother’s brother","my uncle’s son","my sister’s son","my father’s wife"]],
 "Draw your family tree and write 6 sentences about it."),

T("Colors, Shapes, and Sizes","Describe things with color, shape and size.",
 ["What is your favorite color?","What color is your bag?","Is your room big or small?","What shapes can you see around you?"],
 ["red / blue / green|红 / 蓝 / 绿|The sky is blue.","yellow / black / white|黄 / 黑 / 白|I have a black cat.","circle|圆形|The sun is a circle.","square|正方形|The window is a square.","triangle|三角形|A pizza slice is a triangle.","big / small|大 / 小|A big dog, a small cat.","long / short|长 / 短|She has long hair.","tall / wide|高 / 宽|It’s a tall building."],
 ["In English, adjectives come BEFORE the noun, and they never take -s.",
  ["adjective + noun|a red car, a big house","size + color + noun|a big red ball","What color is it? — It’s ___.|It’s green.","It’s a ___ shape. / It’s ___ (adjective).|It’s a round, small box.","two / three + adjective + plural noun|two red apples"],
  ["a car red|a red car","two reds apples|two red apples","It is a color blue.|It is blue.","a very big-big box|a very big box"],
  "Think of colors as describing words: the color word goes right before the thing."],
 ["a ___ car. (red / car red)|red","The ball is a ___. (circle / triangle)|circle","Opposite of “big”|small","a ___ ball. (big red / red big)|big red","What color is the sun? (describe)|It’s yellow.","Put in order: apple / a / red|a red apple","The door is a ___. (square / rectangle)|rectangle","Fix: “She has hairs long.”|She has long hair."],
 ["Describe the room","The student describes the objects in their room (color, shape, size). The teacher draws or guesses.",["It’s a ___ and ___ ___.","What color is it?","It’s very big / small.","It’s on the ___.","I can see a ___."],["Describe 6 things in your room.","Teacher draws one thing from your description.","Ask the teacher about their favorite color."]],
 ["I Spy",["Say “I spy with my little eye something ___.” (a color or shape)","The other guesses “Is it the ___?”","Play 6 rounds, then swap."],["something red","something round","something small","something square","something blue and tall"]],
 "Describe 6 things in your bedroom: color, shape and size in each sentence."),

T("Food, Drinks, and Favorite Meals","Talk about food and order what you like.",
 ["What did you eat for breakfast?","What is your favorite food?","Is there any food you don’t like?","Who cooks at your home?"],
 ["breakfast / lunch / dinner|早 / 午 / 晚餐|I have dinner at 6.","noodles|面条|I love noodles.","rice|米饭|We eat rice every day.","vegetable|蔬菜|Eat more vegetables.","fruit|水果|An apple is a fruit.","delicious|美味的|This soup is delicious.","spicy|辣的|I like spicy food.","thirsty / hungry|渴 / 饿|I’m thirsty."],
 ["Use like / love / don’t like for tastes, and I’d like for polite requests.",
  ["I like / love / don’t like + noun|I like noodles.","I like + verb-ing|I like eating fruit.","I’d like ___, please.|I’d like some water, please.","I’m hungry / thirsty.|I’m very hungry.","What’s your favorite ___?|What’s your favorite food?","some = positive; any = negative / question|I’d like some tea. Do you have any milk?"],

T("Conditional Sentences (If Statements)","Say what happens if, and what would happen if.",
 ["What will you do if it rains tomorrow?","What would you do if you won a million yuan?","What happens if you don’t sleep?","What would you do if you could fly?"],
 ["condition|条件|It depends on the condition.","result|结果|The result is clear.","if|如果|If it rains, I’ll stay home.","unless|除非|I won’t go unless you come.","imagine|想象|Imagine you are a bird.","wish|希望（不真实）|I wish I could fly.","probably|很可能|I’ll probably be late.","otherwise|否则|Hurry, otherwise we’ll miss it."],
 ["Real future: if + present, will + verb. Unreal present: if + past, would + verb.",
  ["Zero: If you heat ice, it melts. (facts)|If you heat water, it boils.","First: If + present, will + base verb|If it rains, I’ll stay home.","Second: If + past, would + base verb|If I had a million, I would travel.","If I were you, I would ___ (advice)|If I were you, I would study.","unless = if not|I won’t go unless you come."],
  ["If I will see him, I will tell him.|If I see him, I will tell him.","If I would have time, I would go.|If I had time, I would go.","If it will rain, I stay home.|If it rains, I will stay home.","If I was you, I will study.|If I were you, I would study."],
  "Don’t use will or would in the if-part. Put it in the other part."],
 ["If it ___ tomorrow, I’ll stay home. (rains / will rain)|rains","If I ___ a million, I would travel. (had / have)|had","If I were you, I ___ study. (would / will)|would","If you heat ice, it ___. (melts / will melts)|melts","I won’t go ___ you come. (unless / if)|unless","If I ___ time, I will help. (have / will have)|have","Make it unreal: If I (be) a bird, I (fly).|If I were a bird, I would fly.","Fix: “If I will see him, I tell him.”|If I see him, I will tell him."],

/* ---------------- Build lesson/slide model ---------------- */
function introSlides(){
  return [
    { type: "title", badge: "Lesson 0 · First Session", title: "Welcome & Level Check", level: "All Levels", note: "This is the student's first session — use it to welcome them and find their level." },
    { type: "teacher" },
    { type: "icebreaker" },
    { type: "levelcheck", data: levelBands[0] },
    { type: "levelcheck", data: levelBands[1] },
    { type: "levelcheck", data: levelBands[2] },
    { type: "introwrap" },
  ];
}
function topicSlides(topic){
  return [
    { type: "title", badge: "Grammar Lesson", title: topic.title, level: topic.level, note: topic.summary },
    { type: "plan", topic },
    { type: "warm", topic },
    { type: "vocab", topic },
    { type: "rule", topic },
    { type: "drill", topic },
    { type: "speak", topic },
    { type: "game", topic },
    { type: "wrap", topic },
  ];
}

const lessons = [
  { id: 0, label: "Lesson 0", title: "Welcome & Level Check", slides: introSlides(),
    sub: "First-session welcome, teacher introduction, and level check." },
  ...topics.map((t, i) => ({
    id: i + 1, label: `Lesson ${i+1}`, title: t.title, slides: topicSlides(t),
    sub: t.level + " · 30-minute lesson: warm-up, vocabulary, language focus, practice, speaking, game, wrap-up.",
  })),
];

/* ---------------- State + storage ---------------- */
let currentLesson = 0;
let currentSlide = 0;

function storeKey(field){ return `vwt-slide:${currentLesson}:${currentSlide}:${field}`; }
function save(field, value){ try{ localStorage.setItem(storeKey(field), value); }catch(e){} }
function load(field, fallback=""){ try{ const v = localStorage.getItem(storeKey(field)); return v===null?fallback:v; }catch(e){ return fallback; } }

/* ---------------- Rendering ---------------- */
const sidebar = document.getElementById('sidebar');
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const lessonTitle = document.getElementById('lessonTitle');
const lessonSub = document.getElementById('lessonSub');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderSidebar(){
  sidebar.innerHTML = '';
  let lastLevel = null;
  lessons.forEach(l => {
    const lvl = l.id === 0 ? 'Start here' : topics[l.id - 1].level;
    if (lvl !== lastLevel) {
      const h = document.createElement('div');
      h.className = 'side-head';
      h.textContent = lvl;
      if (LEVEL_INFO[lvl]) h.title = LEVEL_INFO[lvl];
      sidebar.appendChild(h);
      lastLevel = lvl;
    }
    const btn = document.createElement('button');
    btn.className = 'lesson-btn' + (l.id === currentLesson ? ' active' : '');
    btn.innerHTML = `<span class="num">${l.id}</span> ${l.title}`;
    btn.onclick = () => { currentLesson = l.id; currentSlide = 0; render(); };
    sidebar.appendChild(btn);
  });
  const act = sidebar.querySelector('.lesson-btn.active');
  if (act && act.scrollIntoView && window.innerWidth > 820) { const r = act.getBoundingClientRect(), sr = sidebar.getBoundingClientRect(); if (r.top < sr.top || r.bottom > sr.bottom) sidebar.scrollTop += r.top - sr.top - 80; }
}

    <div class="slide tint">

  return `
    <div class="slide light">
      <div class="eyebrow">MEET YOUR TEACHER</div>

      <p style="font-size:0.85em; color:var(--ink-soft); font-style:italic; margin:0 0 1em;">Volunteers: fill this in before your first session, and click the circle to add your photo.</p>
      <div class="two-col" style="grid-template-columns: 1fr 1.6fr;">
        <div class="card tintbg" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
          <div class="avatar-upload" id="avatarCircle">CLICK TO ADD PHOTO</div>
          <input type="file" id="avatarFile" accept="image/*" style="display:none;">
          <input class="line-input" style="margin-top:1em;" type="text" data-field="t_name" placeholder="Name">
          <input class="line-input" type="text" data-field="t_country" placeholder="Country">

          <h4>A LITTLE ABOUT ME</h4>

          <h4 style="margin-top:0.8em;">HOBBIES &amp; INTERESTS</h4>
          <input class="line-input" type="text" data-field="t_hobbies" placeholder="...">
          <h4 style="margin-top:0.8em;">WHY I VOLUNTEER</h4>

function icebreakerSlideHTML(){
  return `
    <div class="slide light">
      <div class="eyebrow">STUDENT SELF-INTRODUCTION</div>
      <h1 style="font-size:1.9em;">Icebreaker Questions</h1>
      <p style="font-size:0.85em; color:var(--ink-soft); font-style:italic; margin:0 0 1em;">Ask these first — they work at any level and help the student relax.</p>
      <div style="overflow-y:auto;">

function introWrapSlideHTML(){
  const bands = [["Beginner","#1f8a5f"],["Beginner-High","#3e8f6b"],["Intermediate","#1e4e8c"],["Intermediate-High","#f2a73b"]];
  return `
    <div class="slide tint">
      <div class="eyebrow">WRAP-UP</div>
      <h1 style="font-size:1.6em;">Set the Starting Level</h1>
      <div style="display:flex; gap:0.7em; margin-bottom:0.8em;">
        ${bands.map(([label,color]) => `<div class="band-pill" style="border-color:${color};" data-band="${label}" data-color="${color}">${label}</div>`).join('')}
      </div>
      <div class="card" style="flex:1;">
        <h4>FIRST REGULAR LESSON PLAN</h4>
        <input class="line-input" type="text" data-field="plan_topic" placeholder="Recommended starting topic...">
        <input class="line-input" type="text" data-field="plan_time" placeholder="Suggested weekly time...">
        <input class="line-input" type="text" data-field="plan_notes" placeholder="Notes for the next volunteer / admin...">
      </div>

}

function slideHTML(s){
  switch(s.type){
    case 'title': return titleSlideHTML(s);
    case 'plan': return planSlideHTML(s);
    case 'warm': return warmSlideHTML(s);
    case 'vocab': return vocabSlideHTML(s);
    case 'rule': return ruleSlideHTML(s);
    case 'drill': return drillSlideHTML(s);
    case 'speak': return speakSlideHTML(s);
    case 'game': return gameSlideHTML(s);
    case 'wrap': return wrapSlideHTML(s);
    case 'teacher': return teacherSlideHTML();
    case 'icebreaker': return icebreakerSlideHTML();
    case 'levelcheck': return levelCheckSlideHTML(s);
    case 'introwrap': return introWrapSlideHTML();
    default: return '';
  }
}

function wireInputs(){
  stage.querySelectorAll('input[data-field]').forEach(inp => {
    inp.value = load(inp.dataset.field, '');
    inp.addEventListener('input', () => save(inp.dataset.field, inp.value));
  });
  stage.querySelectorAll('.chk').forEach(chk => {
    const key = 'chk_' + chk.dataset.chk;
    if(load(key) === '1') chk.classList.add('checked');
    chk.addEventListener('click', () => {
      chk.classList.toggle('checked');
      save(key, chk.classList.contains('checked') ? '1' : '0');
    });
  });
  stage.querySelectorAll('.band-pill').forEach(pill => {
    const key = 'band_selected';
    if(load(key) === pill.dataset.band){
      pill.classList.add('selected');
      pill.style.background = pill.dataset.color;
    }
    pill.addEventListener('click', () => {
      stage.querySelectorAll('.band-pill').forEach(p => { p.classList.remove('selected'); p.style.background = '#fff'; p.style.color = 'var(--ink)'; });
      pill.classList.add('selected');
      pill.style.background = pill.dataset.color;
      pill.style.color = '#fff';
      save(key, pill.dataset.band);
    });
  });
  const ansBtn = stage.querySelector('#ansBtn');
  if(ansBtn){
    ansBtn.addEventListener('click', () => {
      const show = ansBtn.dataset.on !== '1';
      ansBtn.dataset.on = show ? '1' : '0';
      stage.querySelectorAll('.ans').forEach(a => a.style.visibility = show ? 'visible' : 'hidden');
      ansBtn.textContent = show ? 'Hide answers' : 'Show answers (teacher)';
    });
  }
  const avatarCircle = stage.querySelector('#avatarCircle');
  const avatarFile = stage.querySelector('#avatarFile');
  if(avatarCircle && avatarFile){
    const saved = load('t_photo', '');
    if(saved){ avatarCircle.style.backgroundImage = `url(${saved})`; avatarCircle.textContent = ''; }
    avatarCircle.addEventListener('click', () => avatarFile.click());
    avatarFile.addEventListener('change', () => {
      const file = avatarFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        avatarCircle.style.backgroundImage = `url(${reader.result})`;
        avatarCircle.textContent = '';
        save('t_photo', reader.result);
      };
      reader.readAsDataURL(file);
    });
  }
}

function render(){
  const l = lessons.find(x => x.id === currentLesson);
  const s = l.slides[currentSlide];
  stage.innerHTML = slideHTML(s);
  wireInputs();
  counter.textContent = `Slide ${currentSlide + 1} of ${l.slides.length}`;
  lessonTitle.textContent = `${l.label}: ${l.title}`;
  lessonSub.textContent = l.sub;
  prevBtn.disabled = currentSlide === 0;
  nextBtn.disabled = currentSlide === l.slides.length - 1;
  renderSidebar();
}

prevBtn.onclick = () => { if(currentSlide > 0){ currentSlide--; render(); } };
nextBtn.onclick = () => {
  const l = lessons.find(x => x.id === currentLesson);
  if(currentSlide < l.slides.length - 1){ currentSlide++; render(); }
};
document.addEventListener('keydown', (e) => {
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
});
document.getElementById('fsBtn').onclick = () => { if(stage.requestFullscreen) stage.requestFullscreen(); };
document.getElementById('clearBtn').onclick = () => {
  if(!confirm('Clear everything typed in for this lesson? This cannot be undone.')) return;
  const prefix = `vwt-slide:${currentLesson}:`;
  Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k => localStorage.removeItem(k));
  render();
};

render();
</script>

</body>
